name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt
      - name: 导出 OpenAPI 契约
        working-directory: backend
        run: python scripts/export_openapi.py
      - name: 契约变更必须同步提交 frontend/openapi.json
        run: git diff --exit-code frontend/openapi.json
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .
      - name: 类型检查 (mypy)
        working-directory: backend
        run: mypy app
      - name: 测试 (pytest)
        working-directory: backend
        env:
          WF_DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 类型生成与契约比对（schema.d.ts 必须与 openapi.json 一致）
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts
      - name: 构建（含 vue-tsc 类型检查）
        working-directory: frontend
        run: npm run build
