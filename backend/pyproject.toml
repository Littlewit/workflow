[project]
name = "workflow-backend"
version = "0.1.0"
description = "通用工作流引擎后端"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
# alembic/versions 为自动生成代码，不做 lint
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # 基础错误 + isort 导入排序 + pyupgrade + bugbear

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"          # 测试函数无需逐个标记 asyncio
testpaths = ["tests"]
